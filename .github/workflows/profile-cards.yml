name: Refresh profile cards
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */12 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/profile_cards.py'
      - '.github/workflows/profile-cards.yml'
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile_cards.py
      - name: Publish cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards
          git diff --cached --quiet || git commit -m 'Refresh profile statistics'
          git pull --rebase
          git push
